# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/v0.4.schema.json
version: "v0.4"

project:
  name: "Akopyan's PL Nash–Kuiper–Gromov theorem"
  description: >-
    Let P be a finite polyhedral space with compatible simplex charts of
    constant curvature κ ∈ {−1,0,1}, let d be the chart dimension, and let
    n ≥ d. Every short map from P to the corresponding n-dimensional model
    should admit a uniformly close PL-isometry. In the spherical case the
    Challenge additionally assumes uniform strict shortness or that the image
    lies in an open hemisphere.
  authors:
    - "Arseniy Akopyan"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arseniy Akopyan"

